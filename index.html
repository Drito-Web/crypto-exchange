<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CryptoExchange</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container nav">
      <h1>CryptoExchange</h1>
      <nav>
        <a href="#">Inicio</a>
        <a href="#">Mercados</a>
        <a href="login.html">Login</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <h2>Compra y vende criptomonedas al instante</h2>
    <p>Simula una compra o venta de BTC, ETH, y más...</p>
    <button>Empezar ahora</button>
  </section>

  <section class="market">
    <h3>Mercado en Vivo</h3>
    <table>
      <thead>
        <tr>
          <th>Moneda</th>
          <th>Precio</th>
          <th>Cambio 24h</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>BTC/USD</td>
          <td>$67,500</td>
          <td class="up">+1.24%</td>
        </tr>
        <tr>
          <td>ETH/USD</td>
          <td>$3,500</td>
          <td class="down">-0.85%</td>
        </tr>
      </tbody>
    </table>
  </section>

  <footer>
    <p>&copy; 2025 CryptoExchange - Todos los derechos reservados</p>
  </footer>
</body>
</html>
